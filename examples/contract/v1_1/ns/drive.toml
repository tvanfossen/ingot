# A motion subsystem: desired settings, reported state, a struct key and a struct command.

[meta]
id = "drive"
namespace_id = 3

[enums.mode.values]
off = 0
eco = 1
sport = { value = 2, wire = "sportMode" }   # a wire string other than the name

[enums.mode.variants.sku_b]              # sku_b renames 1, adds 3, has no sport
remove = ["sport"]

[enums.mode.variants.sku_b.values]
saver = 1
turbo = 3

[enums.fan.values]                       # a shadowed enum: explicit wire strings, an inbound alias
quiet = { value = 0, wire = "quiet" }
normal = { value = 1, wire = "normal" }
boost = { value = 2, wire = "high", accept = ["max"] }   # reported "high"; "high" and "max" accepted

[enums.fan.variants.sku_b.values]        # sku_b calls 0 whisper and still accepts "quiet"
whisper = { value = 0, wire = "whisper", accept = ["quiet"] }

[enums.tone.values]                      # the wire strings a rendered index list selects
beep = { value = 0, wire = "beep" }
chime = { value = 1, wire = "chime" }

[[classes]]
id = "settings"
class_index = 0
role = "settings"
persistence = "durable"

[[classes.keys]]
id = "speed_limit"
key_index = 0
type = "uint16"
unit = "mm/s"
min = 0
max = 2000
step = 10
introduced_in = "1.0"
write_rate = "1/min"
default = 100
defaults = { sku_b = 80 }
shadow = "settings.speedLimit"
apply_group = "motion"
on_reject = "clear_desired"

[[classes.keys]]
id = "mode"
key_index = 1
type = "uint8"
enum = "mode"
introduced_in = "1.0"
write_rate = "1/min"
default = 1

[[classes.keys]]
id = "gain"
key_index = 2
type = "float32"
introduced_in = "1.0"
write_rate = "1/min"
default = 1.5
defaults = { sku_b = 0.75 }

[[classes.keys]]
id = "max_accel"
key_index = 3
type = "uint16"
unit = "mm/s2"
allowed = [250, 500, 1000]
introduced_in = "1.1"
write_rate = "1/min"
default = 500

[[classes.keys]]
id = "fan"
key_index = 5
type = "uint8"
enum = "fan"
introduced_in = "1.0"
write_rate = "1/min"
default = 1
shadow = "settings.fanSpeed"
apply_group = "motion"
inbound_unknown = "quiet"            # an unmatched string is quiet (code 0), as today
implies = [ { key = "drive.settings.speed_limit", value = 500 } ]

[[classes]]
id = "state"
class_index = 1
role = "state"
deferred_ms = 5000   # class default interval: odometer uses it, the other keys are not deferred

[[classes.keys]]
id = "speed"
key_index = 0
type = "int16"
introduced_in = "1.0"
write_rate = "10/s"
rate_burst = 20
alias_of = "drive.state.velocity"
doc = "Renamed to velocity in 1.1; kept as its alias for the rest of major 1."

[[classes.keys]]
id = "velocity"
key_index = 5
type = "int16"
introduced_in = "1.1"
write_rate = "10/s"
rate_burst = 20

[[classes.keys]]
id = "odometer"
key_index = 1
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
write_rate = "1/s"

[[classes.keys]]
id = "enabled"
key_index = 2
type = "bool"
introduced_in = "1.0"
default = false

[[classes.keys]]
id = "label"
key_index = 3
type = "string"
max_size = 32
introduced_in = "1.0"
default = "idle"

[[classes.keys]]
id = "error_overcurrent"
error = { group = "product", bit = 1 }
key_index = 4
type = "bool"
introduced_in = "1.0"
doc = "Error key: set and cleared by the integrator."

[[classes.keys]]
id = "error_dock_jam"
key_index = 6
type = "bool"
introduced_in = "1.0"
variants = ["sku_b"]                 # exists on sku_b only
error = { group = "dock", bit = 0 }
doc = "Dock error of sku_b (wire id e50)."

[[classes.keys]]
id = "fan_applied"
key_index = 7
type = "uint8"
enum = "fan"
introduced_in = "1.0"
shadow = ["state.fanSpeed", "settings.fanSpeed"]   # one STATE key at two reported paths
applies = "drive.settings.fan"
outbound_unknown = "normal"          # a code past the enum reports "normal"

[[classes.keys]]
id = "speed_limit_applied"
key_index = 8
type = "uint16"
introduced_in = "1.0"
shadow = "settings.speedLimit"
applies = "drive.settings.speed_limit"

[[classes.keys]]
id = "tones"
key_index = 10
type = "string"
max_size = 8
introduced_in = "1.0"
shadow = "state.tones"
render = { kind = "csv_index_list", enum = "tone", max_items = 4 }   # "0,1" reports ["beep","chime"]
telem = "tones"

[[classes.keys]]
id = "docked"
key_index = 11
type = "bool"
introduced_in = "1.0"
shadow = "state.docked"
forced = true                        # re-emitted on every delta
telem = "dock"

[[classes]]
id = "map"
class_index = 2
role = "state"

[[classes.keys]]
id = "map_data"
key_index = 0
type = "struct"
max_size = 65536
introduced_in = "1.0"

[[classes]]
id = "command"
class_index = 3
role = "command"

[[classes.commands]]
id = "map_edit"
cmd_index = 0
result_index = 1
dedupe_index = 2
introduced_in = "1.0"
persistence = "durable"
owner = "iotd.map"
payload = "struct"
payload_max = 32768
result_max = 256
max_edits = 32
dedupe_ring = 8
write_rate = "1/min"
