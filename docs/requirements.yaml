# Requirements catalog for this fork of ingot (clew-guard). Fork-only file: not part of upstream.
# Every `@req REQ-ING-...` tag in source resolves to an entry here (cross_reference: true).
# Id pattern: ^REQ-ING-[A-Z]+-[0-9]{3}$ (.clew.yaml). HAND-EDITED: add the entry before the code.
# Schema is clew-guard's: a mapping keyed by id; `name` is required.

requirements:
  # -- command line -----------------------------------------------------------------------------
  REQ-ING-CLI-001:
    name: Command-line generation run
    subsystem: CLI
    description: >-
      ingot parses its command line, sets the log level from -v, loads, filters, validates and
      generates the named model for the selected target, and exits with status 1 after logging
      the error when any step fails.
    acceptance_criteria: >-
      A valid model generates and exits 0; an invalid model logs each validation error and exits 1;
      --include-list with --exclude-list is refused.
  REQ-ING-CLI-002:
    name: Embedded templates
    subsystem: CLI
    description: >-
      Every template is compiled into the binary, so the ingot commit alone determines the
      output (table-interface R-T5). --templates or INGOT_TEMPLATES_DIR replaces them with a
      directory for template development; a directory that does not exist is an error.
    acceptance_criteria: >-
      Generation works from a directory with no templates/; every file in templates/ is
      embedded; an explicit missing path is a clear error; an explicit or environment path is
      used instead of the embedded set.
  REQ-ING-TIV-001:
    name: Fixed table-interface header
    subsystem: Table interface
    description: >-
      ingot emits dmt_types.h, the TIV 1.0 header frozen in the table-interface specification
      section 2 (type codes, persistence classes, roles, principal kinds, flags, sizing
      constants, the rights macro, the dmt_key_t, dmt_principal_t, dmt_uid_caps_t and
      dmt_command_t layouts and the well-known role list). Its bytes depend only on the TIV, never
      on a model; --table-types writes it with no model.
    acceptance_criteria: >-
      The header compiles as C99 with -Wall -Wextra -pedantic -Werror; a C check pins every
      frozen value, struct size and field offset; two runs give identical bytes.
  REQ-ING-CLI-003:
    name: Multi-file model loading
    subsystem: CLI
    description: >-
      --model accepts files and directories (a directory contributes its .toml files in sorted
      order); several files are validated individually and merged into one model in which every
      class keeps its file's namespace name and ID and enum references are namespace-qualified.
    acceptance_criteria: >-
      A directory of namespace files generates keys under each file's namespace; an empty
      directory is an error.
  REQ-ING-CLI-004:
    name: Per-variant resolution
    subsystem: CLI
    description: >-
      --variant replaces each key's default with its per-variant default and merges per-variant
      enum values over the base values before validation and generation.
    acceptance_criteria: >-
      A key with defaults.<variant> generates that value only when --variant names it.
  REQ-ING-CLI-005:
    name: Model statistics report
    subsystem: CLI
    description: >-
      Every run prints the model's key count per storage type (bool, each integer width,
      read-only and read-write strings) to stdout.
    acceptance_criteria: >-
      The printed counts equal the number of keys of each type in the model.

  # -- model ------------------------------------------------------------------------------------
  REQ-ING-MOD-001:
    name: TOML model schema
    subsystem: Model
    description: >-
      A model file is parsed from Kaitai-inspired TOML into meta, named enums with per-variant
      values, and classes of keys with type, defaults, enum reference, max_size and the
      read_only, thread_safe, persistent, event and helpers flags (helpers defaults to true).
    acceptance_criteria: >-
      The shipped examples parse with the documented field values.
  REQ-ING-MOD-002:
    name: Data types and their codes
    subsystem: Model
    description: >-
      Each data type has a unique 4-bit type code (unsigned widths, then signed, string 8,
      binary 9, 7 reserved for float) and a C and Rust type name for code generation.
    acceptance_criteria: >-
      Type codes are unique and below 16; the C and Rust names match the documented table.
  REQ-ING-KEY-001:
    name: 32-bit key encoding
    subsystem: Model
    description: >-
      A key ID packs namespace (bits 31-22), class (21-17), index (16-7), type code (6-3),
      thread-safe (2), derived (1) and read-only (0); decoding is the exact inverse.
    acceptance_criteria: >-
      Round trip is lossless; all-ones fields encode to 0xFFFFFFFF; all-zero fields to 0.
  REQ-ING-KEY-002:
    name: Key position resolution
    subsystem: Model
    description: >-
      A key's namespace ID, class index and key index come from the explicit namespace_id,
      class_index and key_index when set, otherwise from the model-level namespace ID and the
      class's and key's declaration position in its file, assigned once when the file is parsed
      (before any key-list filtering, so a filtered build keeps every key's ID).
    acceptance_criteria: >-
      Explicit indices appear in the encoded ID; omitted ones follow declaration order; a
      filtered key keeps its unfiltered ID.
  REQ-ING-VAL-001:
    name: Model validation
    subsystem: Model
    description: >-
      Before generation the model is checked for class and key count limits, duplicate class
      and key ids and indices per namespace, index and namespace ID ranges, string and binary
      keys without max_size, undefined enum references, and read-only persistent keys; every
      violation is reported.
    acceptance_criteria: >-
      Each violation class produces its own error; the shipped examples validate.
  REQ-ING-FLT-001:
    name: Include and exclude key lists
    subsystem: Model
    description: >-
      --include-list keeps only the keys named in a YAML list and --exclude-list removes them;
      entries match the bare or DM_KEY_-prefixed define name, the name with underscores
      removed, or the key's encoded ID as a hex string or integer.
    acceptance_criteria: >-
      An include list of one key leaves one key; an exclude list removes exactly the named keys;
      a hex-ID entry selects its key in the include, exclude and persistent lists.
  REQ-ING-FLT-002:
    name: Persistent key list
    subsystem: Model
    description: >-
      --persistent-keys marks every key named in a YAML list as persistent.
    acceptance_criteria: >-
      Listed keys become persistent and no other key changes.
  REQ-ING-FLT-003:
    name: Property override list
    subsystem: Model
    description: >-
      --property-override-list replaces the default of each key named in a YAML mapping with its
      default_value, matching names with underscores removed.
    acceptance_criteria: >-
      Integer, string and boolean overrides apply and the applied count is reported.

  # -- C generation -----------------------------------------------------------------------------
  REQ-ING-GEN-001:
    name: C output generation
    subsystem: C target
    description: >-
      For a C target ingot renders every C output of the model into the output directory, each
      file ending in exactly one newline, and logs what it generated.
    acceptance_criteria: >-
      Generating twice from the same input gives byte-identical output.
  REQ-ING-GEN-002:
    name: Key definitions header
    subsystem: C target
    description: >-
      key_definitions.h defines DM_KEY_<NAMESPACE>_<CLASS>_<KEY> as the encoded ID of every key.
    acceptance_criteria: >-
      Each define equals the key's encoding.
  REQ-ING-GEN-003:
    name: Namespace definitions header
    subsystem: C target
    description: >-
      dm_namespace_definitions.h lists every namespace of the model once with its namespace ID.
    acceptance_criteria: >-
      A multi-namespace model lists each namespace exactly once.
  REQ-ING-GEN-004:
    name: Boolean storage
    subsystem: C target
    description: >-
      Boolean keys are stored as packed bits in uint32_t words at perfect-hash positions, with
      their defaults set in the initial words and the smallest G-table type that fits.
    acceptance_criteria: >-
      The generated Unity tests read every boolean default back.
  REQ-ING-GEN-005:
    name: Integer storage
    subsystem: C target
    description: >-
      Integer keys are stored per width and signedness in perfect-hash order with their defaults
      and the smallest G-table type that fits.
    acceptance_criteria: >-
      The generated Unity tests read every integer default back and round-trip a set value.
  REQ-ING-GEN-006:
    name: String storage
    subsystem: C target
    description: >-
      String keys are stored in read-only and read-write groups, each with its own perfect hash,
      fixed-size buffers from max_size, and C-escaped defaults.
    acceptance_criteria: >-
      The generated Unity tests read every string default back, including escaped characters.
  REQ-ING-GEN-007:
    name: Persistence storage
    subsystem: C target
    description: >-
      Persistent keys are collected into one persistence struct with typed fields and C literal
      defaults, with load and save hooks.
    acceptance_criteria: >-
      The generated persistence tests save and restore every persistent key.
  REQ-ING-GEN-008:
    name: Typed helpers
    subsystem: C target
    description: >-
      Keys with helpers = true get typed get and set helpers (getter only for read-only keys),
      enum-typed when the key references an enum.
    acceptance_criteria: >-
      A helper exists for every helpers = true key and none for read-only setters.
  REQ-ING-GEN-009:
    name: Generated Unity tests
    subsystem: C target
    description: >-
      ingot emits test_dm.c and a CMakeLists.txt that check every key's default, a set and get
      with a value different from the default, read-only refusal and persistence round trips.
    acceptance_criteria: >-
      The generated tests pass for every example model, with and without events.
  REQ-ING-GEN-010:
    name: C enum types
    subsystem: C target
    description: >-
      Every named enum generates one typedef enum in dm_enums.h, named from its namespace and
      enum name, with members sorted by value, shared by every key that references it.
    acceptance_criteria: >-
      The battery example's enums generate with members in value order.
  REQ-ING-GEN-011:
    name: API dispatch per integer type
    subsystem: C target
    description: >-
      dm.h and dm.c dispatch get and set by key type to the matching integer storage functions
      and value fields.
    acceptance_criteria: >-
      Every integer width present in the model has a dispatch entry.
  REQ-ING-TGT-001:
    name: Target platform settings
    subsystem: C target
    description: >-
      Each C target (STM32, ESP32 Xtensa and RISC-V, 8-bit MCU, 64-bit Linux) has fixed pointer
      width, alignment, inline size and mutex settings used by the templates.
    acceptance_criteria: >-
      Linux64 uses a pthread mutex, ESP a FreeRTOS mutex, STM32 and 8-bit none.
  REQ-ING-MAN-001:
    name: dm_full.yaml manifest
    subsystem: C target
    description: >-
      Every C generation writes dm_full.yaml listing namespaces, classes and keys with define
      name, encoded ID, type, max size, default and enum values, for downstream tools.
    acceptance_criteria: >-
      Manifest key IDs equal the encoded IDs and defaults match the key types.
  REQ-ING-EVT-001:
    name: tinyfsm event structs and dispatch
    subsystem: C target
    description: >-
      With --emit-tinyfsm, every event = true key gets an empty tinyfsm::Event struct grouped by
      namespace and class, and send_tinyfsm_event_by_key() dispatches a key ID to its event
      through a consumer-provided seam; nothing is emitted without the flag or without event keys.
    acceptance_criteria: >-
      The generated wrapper compiles, links and runs against real tinyfsm.
  REQ-ING-EVT-002:
    name: Has-event predicate
    subsystem: C target
    description: >-
      With --emit-tinyfsm, dm_key_has_event(key) is true for exactly the keys that have an event
      struct, generated from the same list as the dispatch switch.
    acceptance_criteria: >-
      True for an event key, false for a non-event key and for a non-key ID.
  REQ-ING-EVT-003:
    name: Event type list
    subsystem: C target
    description: >-
      With --emit-tinyfsm, dm_event_list<KE, L> pairs every event key with its event struct in
      model order and dm_event_count gives its length; the consumer supplies both templates.
    acceptance_criteria: >-
      The list instantiates against tinyfsm with the right size and only tinyfsm events.

  # -- Rust target ------------------------------------------------------------------------------
  REQ-ING-RST-001:
    name: no_std Rust module
    subsystem: Rust target
    description: >-
      --target rust renders a single no_std Rust module with static storage and encoded-key
      access instead of C output.
    acceptance_criteria: >-
      The generated module compiles and its tests pass for every example model.
  REQ-ING-RST-002:
    name: Rust static storage
    subsystem: Rust target
    description: >-
      Rust storage holds each scalar type in a perfect-hash-ordered array with its defaults, and
      strings and binaries as fixed-size byte arrays, with by-key accessors that reject writes to
      read-only keys.
    acceptance_criteria: >-
      Defaults read back and by-key writes to read-only keys are refused.
  REQ-ING-RST-003:
    name: Rust enum types
    subsystem: Rust target
    description: >-
      Each named enum generates one Rust enum with the smallest repr that holds its values,
      named in PascalCase from its namespace, and enum-typed accessors for keys that use it.
    acceptance_criteria: >-
      The battery example's enums generate with the smallest fitting repr.

  # -- perfect hash -----------------------------------------------------------------------------
  REQ-ING-HSH-001:
    name: Jenkins hash
    subsystem: Hash
    description: >-
      Key IDs hash with the final() mix of Jenkins lookup3, matching the reference implementation
      the generated C uses.
    acceptance_criteria: >-
      Outputs match the reference values; different keys or seeds give different hashes.
  REQ-ING-HSH-002:
    name: Perfect hash construction
    subsystem: Hash
    description: >-
      A minimal perfect hash (CHM, two seeds) maps every key of a set to a distinct slot, and
      lookup and verify use the same two hashes.
    acceptance_criteria: >-
      Generated hashes verify for small, medium and large key sets, deduplicating input.
  REQ-ING-HSH-003:
    name: Deterministic seeds
    subsystem: Hash
    description: >-
      Perfect-hash seeds derive from the key set (FNV-1a), so the same keys always give the same
      tables.
    acceptance_criteria: >-
      Two runs on the same key set give identical seeds and tables.

  # -- repository tooling -----------------------------------------------------------------------
  REQ-ING-POL-001:
    name: Commit message policy
    subsystem: Tooling
    description: >-
      The commit-msg hook rejects a commit without a valid Signed-off-by trailer, or with a
      parsed trailer naming an AI tool or vendor.
    acceptance_criteria: >-
      Signed commits pass; unsigned commits and AI trailers are rejected.
  REQ-ING-POL-002:
    name: Agent hook-bypass guard
    subsystem: Tooling
    description: >-
      The agent PreToolUse guard denies shell commands that run git commit with --no-verify,
      -n or a core.hooksPath override, through wrappers and nested shells.
    acceptance_criteria: >-
      Bypass forms are denied and ordinary commits are allowed.
  REQ-ING-ROM-001:
    name: ROM estimate of generated C
    subsystem: Tooling
    description: >-
      scripts/estimate_rom.py compiles every generated .c file (except the test harness) and
      reports .text, .rodata and .data sizes per file and in total.
    acceptance_criteria: >-
      A generated directory produces a per-file and total report; a missing directory exits 1.
  REQ-ING-TSK-001:
    name: Development tasks
    subsystem: Tooling
    description: >-
      invoke tasks run the checks, build, tests (Rust, generated C in both event modes, and the
      C++ tinyfsm fixture), coverage, clean and example generation.
    acceptance_criteria: >-
      invoke test runs every suite and fails when any fails.
  REQ-ING-TSK-002:
    name: Version bump
    subsystem: Tooling
    description: >-
      invoke bump-version rewrites the crate version in every file that embeds it, and with no
      version prints a dry run.
    acceptance_criteria: >-
      A bump changes Cargo.toml and the man page version and date only.
  REQ-ING-TIV-002:
    name: Contract-mode model input
    subsystem: Table interface
    description: >-
      --contract reads contract.toml (contract version, bounds, reserved IDs, principals, per-uid
      caps) and the namespace files in its namespace_dir, in the schema of the table-interface
      specification section 7. Unknown fields are errors, and every namespace_id, class_index
      and key_index is explicit (no positional IDs). Every grant names either one existing key,
      or a namespace with an optional class that covers at least one key.
    acceptance_criteria: >-
      The generic test model loads; a missing index or an unknown field is an error naming the
      file; a class-only grant, or a grant on a key, namespace or class that does not exist, is
      refused.
  REQ-ING-TIV-003:
    name: Resolved key table
    subsystem: Table interface
    description: >-
      Each key resolves to its encoded ID (flag bits zero), type code, size, persistence class
      and interval from the class default or its override, survives-reset (always in an MFG
      namespace), secret and alias flags, transport mask derived from type and secrecy, role,
      write rate and introduced-in minor; dmt_keys is sorted by ID.
    acceptance_criteria: >-
      The generic model's keys appear sorted with the documented field values.
  REQ-ING-TIV-004:
    name: Variant-resolved default values
    subsystem: Table interface
    description: >-
      A key's default for the selected variant (defaults.<variant>, else default) is encoded into
      dmt_default_blob in the specification's value encoding (little-endian scalars, one-byte
      bool, IEEE-754 float32, string and binary bytes); struct keys have none.
    acceptance_criteria: >-
      Two variants give different blobs for keys with per-variant defaults and equal ones otherwise.
  REQ-ING-TIV-005:
    name: Command-type expansion
    subsystem: Table interface
    description: >-
      Each command declares its keys' indices, persistence class, owner, payload, result,
      edit and dedupe sizes once; ingot generates the command, result and dedupe keys in that one
      class and a dmt_commands row for it.
    acceptance_criteria: >-
      A command yields three keys sharing one persistence class and a row naming them.
  REQ-ING-TIV-006:
    name: Principals and resolved rights
    subsystem: Table interface
    description: >-
      Principals (uid or token sub-consumer, kind, flags, heartbeat, caps, resync limits) are
      sorted by (kind, uid, token); rights per key come from (namespace, class) grants overridden
      by key grants, read on a secret only for its readers, packed in the specification's bitmap
      layout; user names are emitted for UNIX token-0 principals only.
    acceptance_criteria: >-
      The generic model's rights rows match its grants bit for bit.
  REQ-ING-TIV-007:
    name: Rates, queue bounds and budgets
    subsystem: Table interface
    description: >-
      Write rates "<n>/s|min|h|day" become writes per day with a token-bucket burst; each
      principal's queue bound is computed in integer arithmetic from its readable keys' rates and
      its latency budget; staging and in-process budgets are checked against their lower bounds.
    acceptance_criteria: >-
      Hand-computed queue bounds match; a budget below its lower bound is refused.
  REQ-ING-TIV-008:
    name: KSET v1 handshake digests
    subsystem: Table interface
    description: >-
      For every principal and every minor 0..contract minor, the SHA-256 KSET v1 digest of the
      (key ID, type) pairs it may read or write as of that minor, per docs/handshake-digest.md of
      the keystore.
    acceptance_criteria: >-
      Golden vectors V0-V5 reproduce; the generic model's 1.0 digests reappear unchanged in 1.1.
  REQ-ING-TIV-009:
    name: Generated store tables
    subsystem: Table interface
    description: >-
      Contract mode writes dmt_types.h, dmt_tables.h and dmt_tables.c (constant data, no heap,
      sorted arrays, version and provenance defines, the dmt_tiv_major_1 link symbol) and
      contract.json, deterministically for the same input, variant and ingot commit.
    acceptance_criteria: >-
      The tables compile as strict C99 and link with a check that walks them; two runs are
      byte-identical.
  REQ-ING-TIV-010:
    name: Model refusals
    subsystem: Table interface
    description: >-
      Contract mode refuses, as errors, the structural refusals of the specification section 8:
      duplicate namespace IDs, namespace names or encoded IDs, ID 0, read_only or thread_safe
      keys, live keys on reserved IDs, persistent keys without a rate, deferred keys without an
      interval, struct keys without max_size, bad aliases, introduced-in later than the
      contract, bad defaults, well-known role errors, duplicate or unheartbeated principals,
      and budget violations; and
      the sizes the keystore reads well-known keys with: DIAG_SUBSCRIBERS max_size at least
      4 + 20 per principal, DIAG_KEYSTORE_VERSION at least 30, DIAG_CONTRACT_VERSION at least 17,
      and the TRACE_ENABLE command's payload_max at least 118 (its signed envelope).
    acceptance_criteria: >-
      Each refusal has a model that triggers it and the generic model triggers none.
  REQ-ING-TIV-011:
    name: Rights refusals
    subsystem: Table interface
    description: >-
      Contract mode refuses secrets reachable over UART or granted to non-readers, struct keys in
      UART or in-process subsets, aliases whose rights differ from their target's, UART writes to
      reset, MFG or trace-enable keys, heartbeat keys writable by another principal or shared,
      writes to core-written well-known keys, a trace-enable command without exactly one writer,
      RESET_REQUEST or TRACE_ENABLE not owned by the core (and core ownership anywhere else), a
      principal owner without read on its command and write on its result, and any write on a
      dedupe key or on the result of a core-answered command (keystore REQ-KS-CMD-003).
    acceptance_criteria: >-
      Each refusal has a model that triggers it.
  REQ-ING-TIV-012:
    name: Previous-contract checks and release review
    subsystem: Table interface
    description: >-
      With --previous-contract, a minor must be additive (no key removed or changed, no rights,
      persistence, secret, survives-reset, size, interval, alias or enum change, no principal
      removed or changed, new keys at the new version) and a major must reserve every removed
      ID and never reuse one; new principals with sensitive grants are listed in
      release-review.txt.
    acceptance_criteria: >-
      1.1 passes against 1.0 and 2.0 against 1.1; the 2.0 change labelled 1.2 is refused.
  REQ-ING-TIV-013:
    name: Build provenance
    subsystem: Table interface
    description: >-
      The tables state the ingot version and the commit it was built from, and the model hash;
      contract mode refuses a build from a dirty tree or unknown commit unless
      --allow-dirty-ingot is given, which marks the commit -dirty. `ingot --version` prints the
      same commit, and the build re-runs on the real git dir (also in a submodule or worktree).
    acceptance_criteria: >-
      A dirty commit string is refused without the flag and accepted with it.
  REQ-ING-TIV-014:
    name: Generic test model
    subsystem: Table interface
    description: >-
      examples/contract holds a product-neutral model at contract 1.0, 1.1 and 2.0 that
      exercises every type, persistence class, principal kind and refusal-relevant feature, for
      the keystore's conformance and handshake suites.
    acceptance_criteria: >-
      All three versions generate; 1.1 passes against 1.0 and 2.0 against 1.1.
  REQ-ING-TIV-015:
    name: Declared variants
    subsystem: Table interface
    description: >-
      contract.toml may declare its variants ([contract] variants). When it does, --variant must
      name one of them, and every per-variant default and per-variant enum names a declared
      variant; contract.json lists the declared variants.
    acceptance_criteria: >-
      An undeclared --variant, a missing --variant, and a defaults or enum entry for an
      undeclared variant are refused, the message listing the declared variants.
  REQ-ING-TIV-016:
    name: Per-variant enum values and wire strings
    subsystem: Table interface
    description: >-
      Each enum value has a wire string (its name unless given). A variant may add a number,
      rename the name and wire string of a base number, or remove a base name; the resolved enum
      has unique numbers, names and wire strings. Keys, defaults and contract.json use the
      resolved enum of the selected variant; the store tables and KSET digests do not depend on
      enum maps. Against --previous-contract in a minor, every previous (number, wire string)
      pair is kept.
    acceptance_criteria: >-
      A variant's add, rename and remove appear in contract.json; tables and digests are
      unchanged by enum maps; a conflicting map or a changed wire string in a minor is refused.
  REQ-ING-G2-001:
    name: Units, ranges, discrete sets, sentinels and scale
    subsystem: Generated outputs (G2)
    description: >-
      contract.toml may name a unit vocabulary; every unit is then one of its tokens. An integer
      key without an enum may declare an inclusive min/max/step range in wire units or an allowed
      set, a sentinel default (unset) outside them, and a scale to its displayed unit (a scaled
      key names its unit). Every default is accepted by the range or set unless it is the
      sentinel. contract.json carries them and the vocabulary; against --previous-contract in a
      minor a range or set may only widen and unit, scale, sentinel and vocabulary are kept.
    acceptance_criteria: >-
      The generic model declares them; each malformed form is refused; widening passes and
      narrowing is refused against the previous contract.
