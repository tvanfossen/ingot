# A motion subsystem: desired settings, reported state, a struct key and a struct command.

[meta]
id = "drive"
namespace_id = 3

[enums.mode.values]
off = 0
eco = 1
sport = { value = 2, wire = "sportMode" }   # a wire string other than the name

[enums.mode.variants.sku_b]              # sku_b renames 1, adds 3, has no sport
remove = ["sport"]

[enums.mode.variants.sku_b.values]
saver = 1
turbo = 3

[enums.fan.values]
quiet = { value = 0, wire = "quiet" }
normal = { value = 1, wire = "normal" }
boost = { value = 2, wire = "high", accept = ["max"] }

[enums.fan.variants.sku_b.values]
whisper = { value = 0, wire = "whisper", accept = ["quiet"] }

[[classes]]
id = "settings"
class_index = 0
role = "settings"
persistence = "durable"

[[classes.keys]]
id = "speed_limit"
key_index = 0
type = "uint16"
unit = "mm/s"
min = 0
max = 2000
step = 10
introduced_in = "1.0"
write_rate = "1/min"
default = 100
defaults = { sku_b = 80 }

[[classes.keys]]
id = "mode"
key_index = 1
type = "uint8"
enum = "mode"
introduced_in = "1.0"
write_rate = "1/min"
default = 1

[[classes.keys]]
id = "gain_pct"
key_index = 4
type = "uint8"
unit = "%"
min = 0
max = 200
step = 5
scale = 0.5
introduced_in = "2.0"
write_rate = "1/min"
default = 150
defaults = { sku_b = 75 }
doc = "Replaces the float32 gain of major 1 (a type change is a new key)."

[[classes.keys]]
id = "max_accel"
key_index = 3
type = "uint16"
unit = "mm/s2"
allowed = [250, 500, 1000]
introduced_in = "1.1"
write_rate = "1/min"
default = 500

[[classes.keys]]
id = "fan"
key_index = 5
type = "uint8"
enum = "fan"
introduced_in = "1.0"
write_rate = "1/min"
default = 1
doc = "Major 2 maps nothing to the shadow: its keys carry no wire attributes."

[[classes]]
id = "state"
class_index = 1
role = "state"
deferred_ms = 5000   # class default interval: odometer uses it, the other keys are not deferred

[[classes.keys]]
id = "velocity"
key_index = 5
type = "int16"
introduced_in = "1.1"
write_rate = "10/s"
rate_burst = 20

[[classes.keys]]
id = "odometer"
key_index = 1
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
write_rate = "1/s"

[[classes.keys]]
id = "enabled"
key_index = 2
type = "bool"
introduced_in = "1.0"
default = false

[[classes.keys]]
id = "error_overcurrent"
error = { group = "product", bit = 1 }
key_index = 4
type = "bool"
introduced_in = "1.0"
doc = "Error key: set and cleared by the integrator."

[[classes.keys]]
id = "error_dock_jam"
key_index = 6
type = "bool"
introduced_in = "1.0"
variants = ["sku_b"]                 # exists on sku_b only
error = { group = "dock", bit = 0 }
doc = "Dock error of sku_b (wire id e50)."

[[classes.keys]]
id = "fan_applied"
key_index = 7
type = "uint8"
enum = "fan"
introduced_in = "1.0"

[[classes.keys]]
id = "speed_limit_applied"
key_index = 8
type = "uint16"
introduced_in = "1.0"

[[classes.keys]]
id = "tones"
key_index = 10
type = "string"
max_size = 8
introduced_in = "1.0"

[[classes.keys]]
id = "docked"
key_index = 11
type = "bool"
introduced_in = "1.0"

[[classes.keys]]
id = "trip_count"
key_index = 12
type = "uint32"
introduced_in = "1.0"
persistence = "durable"              # a durable key in a state class: one integrator batch spans
write_rate = "1/min"                 # durable, deferred (odometer, run_time) and volatile keys
doc = "Completed trips."

[[classes.keys]]
id = "run_time"
key_index = 13
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
deferred_ms = 60000                  # a second deferred interval next to the class's 5000
write_rate = "1/s"

[[classes]]
id = "map"
class_index = 2
role = "state"

[[classes.keys]]
id = "map_data"
key_index = 0
type = "struct"
max_size = 65536
introduced_in = "1.0"

[[classes]]
id = "command"
class_index = 3
role = "command"

[[classes.commands]]
id = "map_edit"
cmd_index = 0
result_index = 1
dedupe_index = 2
introduced_in = "1.0"
persistence = "durable"
owner = "iotd.map"
payload = "struct"
payload_max = 32768
result_max = 256
max_edits = 32
dedupe_ring = 8
write_rate = "1/min"

[[classes.commands]]
id = "drive"
cmd_index = 3
result_index = 4
dedupe_index = 5
introduced_in = "1.0"
persistence = "none"
owner = "integrator"
payload_max = 64
result_max = 16
dedupe_ring = 4
doc = "A motion verb: go and stop; approvePlan on sku_b."

[[classes.keys]]
id = "plan_epoch"
key_index = 6
type = "uint32"
introduced_in = "1.0"
doc = "Argument of approvePlan."

[[classes.keys]]
id = "map_id"
key_index = 7
type = "uint16"
introduced_in = "1.0"

[[classes.keys]]
id = "area_id"
key_index = 8
type = "uint16"
introduced_in = "1.0"

[[classes.keys]]
id = "map_payload"
key_index = 9
type = "string"
max_size = 512
introduced_in = "1.0"
doc = "Base64 text of a map request, passed through as text."
