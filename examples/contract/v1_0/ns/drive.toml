# A motion subsystem: desired settings, reported state, a struct key and a struct command.

[meta]
id = "drive"
namespace_id = 3

[enums.mode.values]
off = 0
eco = 1
sport = 2

[[classes]]
id = "settings"
class_index = 0
role = "settings"
persistence = "durable"

[[classes.keys]]
id = "speed_limit"
key_index = 0
type = "uint16"
unit = "mm/s"
introduced_in = "1.0"
write_rate = "1/min"
default = 100
defaults = { sku_b = 80 }

[[classes.keys]]
id = "mode"
key_index = 1
type = "uint8"
enum = "mode"
introduced_in = "1.0"
write_rate = "1/min"
default = 1

[[classes.keys]]
id = "gain"
key_index = 2
type = "float32"
introduced_in = "1.0"
write_rate = "1/min"
default = 1.5
defaults = { sku_b = 0.75 }

[[classes]]
id = "state"
class_index = 1
role = "state"

[[classes.keys]]
id = "speed"
key_index = 0
type = "int16"
introduced_in = "1.0"
write_rate = "10/s"
rate_burst = 20

[[classes.keys]]
id = "odometer"
key_index = 1
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
deferred_ms = 5000
write_rate = "1/s"

[[classes.keys]]
id = "enabled"
key_index = 2
type = "bool"
introduced_in = "1.0"
default = false

[[classes.keys]]
id = "label"
key_index = 3
type = "string"
max_size = 32
introduced_in = "1.0"
default = "idle"

[[classes.keys]]
id = "error_overcurrent"
key_index = 4
type = "bool"
introduced_in = "1.0"
doc = "Error key: set and cleared by the integrator."

[[classes]]
id = "map"
class_index = 2
role = "state"

[[classes.keys]]
id = "map_data"
key_index = 0
type = "struct"
max_size = 65536
introduced_in = "1.0"

[[classes]]
id = "command"
class_index = 3
role = "command"

[[classes.commands]]
id = "map_edit"
cmd_index = 0
result_index = 1
dedupe_index = 2
introduced_in = "1.0"
persistence = "durable"
owner = "iotd.map"
payload = "struct"
payload_max = 32768
result_max = 256
max_edits = 32
dedupe_ring = 8
write_rate = "1/min"
