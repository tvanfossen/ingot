# Store-owned keys: the core's diagnostics, the boot epoch, and the reset and trace commands.

[meta]
id = "core"
namespace_id = 1

[[classes]]
id = "diag"
class_index = 0
role = "diag"

[[classes.keys]]
id = "secrets_fallback"
key_index = 0
type = "bool"
introduced_in = "1.0"
wk = "SECRETS_FALLBACK"

[[classes.keys]]
id = "corruption"
key_index = 1
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
deferred_ms = 30000
write_rate = "1/h"
wk = "DIAG_CORRUPTION"

[[classes.keys]]
id = "keystore_version"
key_index = 2
type = "string"
max_size = 32
introduced_in = "1.0"
wk = "DIAG_KEYSTORE_VERSION"

[[classes.keys]]
id = "contract_version"
key_index = 3
type = "string"
max_size = 32
introduced_in = "1.0"
wk = "DIAG_CONTRACT_VERSION"

[[classes.keys]]
id = "fsync_count"
key_index = 4
type = "uint32"
introduced_in = "1.0"
wk = "DIAG_FSYNC_COUNT"

[[classes.keys]]
id = "subscribers"
key_index = 5
type = "binary"
max_size = 512
introduced_in = "1.0"
wk = "DIAG_SUBSCRIBERS"

[[classes]]
id = "config"
class_index = 1
role = "config"
persistence = "durable"

[[classes.keys]]
id = "boot_epoch"
key_index = 0
type = "uint32"
introduced_in = "1.0"
write_rate = "24/day"
survives_reset = true
wk = "BOOT_EPOCH"

[[classes]]
id = "command"
class_index = 2
role = "command"

[[classes.commands]]
id = "factory_reset"
cmd_index = 0
result_index = 1
dedupe_index = 2
introduced_in = "1.0"
persistence = "durable"
owner = "core"
dedupe_ring = 4
write_rate = "1/day"
wk = "RESET_REQUEST"

[[classes.commands]]
id = "pre_reset"
cmd_index = 3
result_index = 4
dedupe_index = 5
introduced_in = "1.0"
persistence = "durable"
owner = "integrator"
dedupe_ring = 4
write_rate = "1/day"
wk = "RESET_PRE_COMMAND"
internal = "sent by the core before a factory reset; never requested on the wire"

[[classes.commands]]
id = "trace_enable"
cmd_index = 6
result_index = 7
dedupe_index = 8
introduced_in = "1.0"
persistence = "none"
owner = "core"
payload_max = 118
dedupe_ring = 4
wk = "TRACE_ENABLE"
doc = "Signed trace-enable envelope; the core verifies it."
internal = "a signed envelope a diagnostic tool delivers, not a shadow request"

# -- shadow wire mapping (G2 1.4): the request origin enum and the core's command rows -------
[enums.origin.values]                    # the envelope source; absent is unspecified
unspecified = 0
unknown = 1
device = 2
cloud = 3
mobile = 4
schedule = 5

[[shadow_commands]]                      # {"net":{"factoryReset":true}}: no state field
topic = "command_topic"
selector = { field = "net.factoryReset", wire = true }
command = "core.command.factory_reset"
